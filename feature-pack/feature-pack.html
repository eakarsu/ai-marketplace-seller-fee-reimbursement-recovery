<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal Feature Pack — Demo</title></head>
<body><h1>Universal Feature Pack</h1><p>Standalone demo: the ✦ panel (bottom-right) and the table tools work with no server. If the host app serves <code>/api/ai/tasks</code>, tasks use its live model; otherwise they run locally offline.</p>
<form><label>Name <input name="name"></label> <label>Email <input name="email" type="email"></label> <label>Status <select name="status"><option>active</option><option>pending</option></select></label></form>
<table><thead><tr><th>Item</th><th>Value</th><th>Status</th></tr></thead><tbody><tr><td>Alpha</td><td>120</td><td>active</td></tr><tr><td>Beta</td><td>45</td><td>pending</td></tr><tr><td>Gamma</td><td>980</td><td>critical</td></tr></tbody></table>
<script src="./feature-pack.js"></script></body></html>
